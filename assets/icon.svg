<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <title>KiLog PCB Operation Recorder</title>
  <desc>Three small plated vias inside a folded document, connected through
    a vertical surface-mount capacitor on the left and a horizontal resistor
    on the right, with copper pads and separated silkscreen bars, without labels.
    The lower-left via connects vertically to the lower capacitor pad, which
    also connects rightward to the resistor through 45-degree bends.</desc>
  <rect width="100" height="100" rx="15" fill="#07382B"/>
  <g fill="none" stroke="#FBA011" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M25 14h37l17 17v55H25z"/>
    <path d="M62 14v17h17"/>
  </g>
  <g fill="none" stroke="#FBA011" stroke-linecap="round" stroke-linejoin="round">
    <!-- Tracks join the pads in series without bypassing either component. -->
    <!-- Straight exits extend beyond pad edges before the 45-degree bends. -->
    <path d="M38 31v12M38 53h5l4 4h3M60 57h5l3 3v12"
      stroke-width="2.2"/>
    <path d="M38 53v19" stroke-width="2.2"/>
    <!-- Open-ended SMD silkscreen stays clear of the exposed copper pads. -->
    <path d="M31.5 43v7M44.5 43v7M50 51h11M50 63h11"
      stroke-width="1.4" stroke-linecap="butt"/>
  </g>
  <g fill="#FBA011">
    <!-- The capacitor has wider pads than the adjacent resistor. -->
    <rect x="34" y="41.5" width="8" height="3" rx="0.3"/>
    <rect x="34" y="51.5" width="8" height="3" rx="0.3"/>
    <rect x="49" y="54" width="3" height="6" rx="0.3"/>
    <rect x="59" y="54" width="3" height="6" rx="0.3"/>
  </g>
  <g fill="#07382B" stroke="#FBA011" stroke-width="2.2">
    <circle cx="38" cy="31" r="3.5"/><circle cx="68" cy="72" r="3.5"/>
    <circle cx="38" cy="72" r="3.5"/>
  </g>
</svg>
